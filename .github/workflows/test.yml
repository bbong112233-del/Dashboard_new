# 회귀 검증 자동 실행
#
#   main 에 올라갈 때마다 브라우저를 띄워 272개 단언을 확인한다.
#   사람이 "테스트 돌리는 걸 잊는" 경우를 없애는 것이 목적이다.
#
#   비밀값을 쓰지 않는다. 검증에 쓰는 데이터는 tests/make-fixture.py 가 매번 만들어 내는
#   가상 데이터이고, 실제 회원사·매출은 저장소에 없다.
name: 회귀 검증

on:
  push:
    branches: [main]
  workflow_dispatch:      # 필요할 때 손으로도 돌릴 수 있게

permissions:
  contents: read          # 저장소를 읽기만 한다 (쓰기 권한 없음)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          npm ci
          python3 -m pip install --quiet openpyxl   # tests/make-fixture.py 가 xlsx 를 만들 때 쓴다

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      # 실패했을 때 "왜" 를 로그 안에만 두지 않는다.
      # 저장소 관리자만 로그를 내려받을 수 있어서, 실패 내용은 주석으로도 남긴다.
      - name: 검증 실행
        run: |
          set -o pipefail
          if ./tests/run-all.sh 2>&1 | tee /tmp/out.txt; then
            exit 0
          fi
          echo "::group::환경"
          echo "node $(node -v) / python $(python3 -V) / $(uname -srm)"
          echo "한글 글꼴: $(fc-list :lang=ko 2>/dev/null | wc -l) 개"
          echo "::endgroup::"
          echo "::error::한글 글꼴 $(fc-list :lang=ko 2>/dev/null | wc -l)개 · node $(node -v) · node_modules/playwright $([ -d node_modules/playwright ] && echo 있음 || echo 없음)"
          # 무엇이 걸렸든 마지막 출력은 반드시 보이게 한다.
          # 패턴으로 고르면, 처음 실패했을 때처럼 한글 메시지가 통째로 빠진다.
          tail -n 25 /tmp/out.txt | grep -v '^[[:space:]]*$' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
